<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a2a5e" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b2552" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treinos">
<link rel="preconnect" href="https://i.ytimg.com">
<title>Ficha de Treino Matheus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Paleta Recife Mariners: azul-marinho e branco; os treinos mantêm as cores de anilha.
   Layout: ficha de academia. Cabeçalho curto, barra fixa com periodização + treinos (cores de anilha olímpica: 25kg vermelho, 20kg azul, 15kg amarelo, 10kg verde), blocos em cartões que viram 2 colunas no iPad deitado. */
:root {
  --bg: #edf1f7;
  --surface: #ffffff;
  --surface-2: #f3f6fb;
  --ink: #0b1d3a;
  --muted: #4f5f78;
  --line: #d5dde9;
  --line-strong: #b3c0d3;
  --navy: #0a2a5e;
  --brand: #0a2a5e;
  --on-brand: #ffffff;
  --band-muted: rgba(255, 255, 255, .74);
  --band-line: rgba(255, 255, 255, .2);
  --band-fill: rgba(255, 255, 255, .08);
  --red: #c41e3a; --blue: #1f62d6; --yellow: #f2b705; --green: #12804f; --steel: #4d6280;
  --plate: var(--red);
  --on-plate: #ffffff;
  --plate-soft: color-mix(in srgb, var(--plate) 12%, var(--surface));
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "Barlow", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --radius: 16px;
  --shadow: 0 1px 2px rgba(11, 29, 58, .06), 0 6px 20px rgba(11, 29, 58, .06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #06101f; --surface: #0d1b31; --surface-2: #12233d; --ink: #e6edf8; --muted: #93a3bd;
    --line: #1f3150; --line-strong: #33496d;
    --navy: #0b2552; --brand: #2c64cc; --on-brand: #ffffff;
    --red: #d2364f; --blue: #2f6fe0; --yellow: #f5c534; --green: #179160; --steel: #5f7594;
    --shadow: 0 1px 2px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #06101f; --surface: #0d1b31; --surface-2: #12233d; --ink: #e6edf8; --muted: #93a3bd;
  --line: #1f3150; --line-strong: #33496d;
  --navy: #0b2552; --brand: #2c64cc; --on-brand: #ffffff;
  --red: #d2364f; --blue: #2f6fe0; --yellow: #f5c534; --green: #179160; --steel: #5f7594;
  --shadow: 0 1px 2px rgba(0,0,0,.35);
  color-scheme: dark;
}
[data-plate] { --plate-soft: color-mix(in srgb, var(--plate) 14%, var(--surface)); }
[data-plate="red"]    { --plate: var(--red); }
[data-plate="blue"]   { --plate: var(--blue); }
[data-plate="yellow"] { --plate: var(--yellow); --on-plate: #1d1700; }
[data-plate="green"]  { --plate: var(--green); }
[data-plate="steel"]  { --plate: var(--steel); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) [data-plate="yellow"] { --on-plate: #1d1700; } }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 16px; line-height: 1.45;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--navy);
}
button { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--plate); outline-offset: 2px; border-radius: 8px; }

.wrap {
  width: 100%; max-width: 1120px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- cabeçalho ---------- */
.top-band { background: var(--navy); color: #fff; position: relative; overflow: hidden; }
.top-band::after {
  content: ""; position: absolute; inset: auto 0 0 0; height: 6px;
  background: repeating-linear-gradient(90deg, #fff 0 18px, transparent 18px 30px); opacity: .14;
}
.top { position: relative; z-index: 1; padding-block: 24px 22px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 24px; }
.who { font-size: 13px; font-weight: 600; color: var(--band-muted); letter-spacing: .06em; text-transform: uppercase; }
.top h1 {
  margin: 4px 0 0; font-family: var(--display); font-weight: 800; font-size: clamp(38px, 8vw, 60px);
  line-height: .92; letter-spacing: -.01em; text-transform: uppercase; text-wrap: balance;
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
}
.now-pill {
  font-family: var(--body); font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  background: #fff; color: var(--navy); border-radius: 999px; padding: 4px 10px; transform: translateY(-6px);
}
.top-meta { display: flex; gap: 8px; flex-wrap: wrap; }
.meta-box {
  border: 1px solid var(--band-line); background: var(--band-fill); border-radius: 12px; padding: 8px 12px; min-width: 92px;
}
.meta-box b { display: block; font-family: var(--display); font-size: 24px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; }
.meta-box span { font-size: 12px; color: var(--band-muted); font-weight: 600; }

/* ---------- barra fixa ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(16px); backdrop-filter: saturate(1.4) blur(16px);
  border-bottom: 1px solid var(--line);
}
.bar .wrap { padding-block: 10px; display: grid; gap: 10px; }
.scroller { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; scroll-padding-inline: 16px; }
.scroller::-webkit-scrollbar { display: none; }
.per-btn {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 8px 14px; font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap; min-height: 40px;
  display: inline-flex; align-items: center; gap: 6px;
}
.per-btn small { font-weight: 600; font-size: 11px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.per-btn[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
.per-btn[aria-pressed="true"] small { color: inherit; opacity: .75; }

.plates { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(156px, 1fr); gap: 10px; overflow-x: auto; scrollbar-width: none; padding: 5px; margin: -5px; }
.plates::-webkit-scrollbar { display: none; }
.plate-btn {
  position: relative; display: flex; align-items: center; gap: 10px; text-align: left; cursor: pointer;
  border: 0; background: var(--plate); color: var(--on-plate);
  border-radius: 14px; padding: 8px 10px; min-height: 58px; min-width: 0;
  box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .18);
  transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
}
.plate-btn:active { transform: translateY(1px); }
.plate-disc {
  flex: 0 0 auto; width: 36px; height: 36px; border-radius: 50%;
  background: var(--on-plate); color: var(--plate);
  display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 19px;
  box-shadow: inset 0 0 0 3px var(--on-plate), inset 0 0 0 5px var(--plate), inset 0 0 0 6px var(--on-plate);
}
.plate-txt { min-width: 0; }
.plate-txt b { display: block; font-size: 15px; line-height: 1.15; }
.plate-txt span { display: block; font-size: 12px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plates:has([aria-pressed="true"]) .plate-btn[aria-pressed="false"] { filter: saturate(.85); }
.plate-btn[aria-pressed="true"] {
  box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--plate), inset 0 -3px 0 rgba(0, 0, 0, .18);
}
.plate-btn[aria-pressed="true"]::after {
  content: ""; position: absolute; right: 10px; top: 50%; width: 8px; height: 8px; margin-top: -4px;
  border-radius: 50%; background: var(--on-plate);
}
.plate-btn[aria-pressed="true"] .plate-txt { padding-right: 12px; }

/* ---------- treino ---------- */
main { padding-block: 22px 120px; }
.w-head { display: grid; gap: 12px; margin-bottom: 18px; }
.w-kicker { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--plate); }
[data-plate="yellow"] .w-kicker { color: color-mix(in srgb, var(--plate) 70%, var(--ink)); }
.w-head h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(30px, 6vw, 44px); line-height: 1; text-transform: uppercase; text-wrap: balance; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; font-weight: 600; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }

.progress { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.progress-track { flex: 1; height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
.progress-fill { height: 100%; width: 0; background: var(--plate); border-radius: inherit; transition: width .3s ease; }
.progress-num { font-family: var(--display); font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.progress-num small { font-family: var(--body); font-size: 12px; color: var(--muted); font-weight: 600; }
.reset { border: 0; background: none; color: var(--muted); font-size: 13px; font-weight: 700; cursor: pointer; padding: 8px 4px; text-decoration: underline; text-underline-offset: 3px; }

.callout { border-left: 4px solid var(--plate); background: var(--surface); border-radius: 0 12px 12px 0; padding: 12px 14px; color: var(--ink); font-size: 15px; max-width: 72ch; }

.sec { margin-top: 26px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; border-bottom: 2px solid var(--brand); padding-bottom: 6px; }
.sec-head h3 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 20px; text-transform: uppercase; letter-spacing: .02em; }
.sec-head span { white-space: nowrap; font-size: 13px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.blocks { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1000px) { .blocks { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; } }

.block { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.b-head { display: flex; align-items: center; gap: 12px; padding: 12px 12px 10px 14px; border-bottom: 1px solid var(--line); }
.b-num { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; min-width: 1.4ch; font-variant-numeric: tabular-nums; }
.b-info { flex: 1; min-width: 0; }
.b-info b { display: block; font-size: 14px; }
.b-info span { display: block; font-size: 12.5px; color: var(--muted); }
.rest-btn {
  flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  border: 1px solid var(--brand); background: var(--brand); color: var(--on-brand); border-radius: 999px;
  padding: 8px 12px; min-height: 40px; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums;
}
.rest-btn svg { width: 16px; height: 16px; }
.rest-none { flex: 0 0 auto; font-size: 12px; color: var(--muted); font-weight: 600; text-align: right; max-width: 110px; line-height: 1.2; }

.ex-list { list-style: none; margin: 0; padding: 4px 0; }
.ex { position: relative; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 10px 12px 10px 14px; }
.ex + .ex { border-top: 1px dashed var(--line); }
.is-combo .ex:not(:last-child)::after, .is-circuit .ex:not(:last-child)::after {
  content: ""; position: absolute; left: 35px; top: 50px; bottom: -12px; width: 2px; background: var(--plate); opacity: .45; z-index: 0;
}
.check {
  position: relative; z-index: 1; width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
  border: 2px solid var(--line-strong); background: var(--surface);
  font-family: var(--display); font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums;
  display: grid; place-items: center; transition: background .15s, border-color .15s, transform .1s;
}
.check:active { transform: scale(.94); }
.check svg { display: none; width: 22px; height: 22px; }
.check[aria-pressed="true"] { background: var(--plate); border-color: var(--plate); color: var(--on-plate); }
.check[aria-pressed="true"] .code { display: none; }
.check[aria-pressed="true"] svg { display: block; }
.ex-main { min-width: 0; }
.ex-name { font-weight: 600; font-size: 16px; line-height: 1.25; overflow-wrap: anywhere; }
.ex[data-done="true"] .ex-name { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.ex-sets { margin-top: 3px; font-family: var(--display); font-weight: 700; font-size: 20px; line-height: 1.1; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.ex-sets em { font-style: normal; font-family: var(--body); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--plate); margin-left: 6px; }
[data-plate="yellow"] .ex-sets em { color: color-mix(in srgb, var(--plate) 70%, var(--ink)); }
.vid {
  position: relative; display: block; flex: 0 0 auto; width: 120px; aspect-ratio: 16 / 9; max-width: 100%;
  border-radius: 10px; overflow: hidden; text-decoration: none;
  background: var(--plate-soft); border: 1px solid color-mix(in srgb, var(--plate) 35%, var(--line));
}
.vid img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.vid.no-thumb img { display: none; }
.vid .play {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  background: rgba(0, 0, 0, .62); color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.3);
}
.vid.no-thumb .play { background: var(--plate); color: var(--on-plate); box-shadow: none; }
.vid .play svg { width: 16px; height: 16px; margin-left: 2px; }
.vid:active { transform: scale(.97); }
.ex-note { margin-top: 2px; font-size: 12px; color: var(--muted); font-weight: 600; }

.notes { margin-top: 30px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
.notes h3 { margin: 0 0 6px; font-family: var(--display); font-size: 20px; text-transform: uppercase; }
.notes p { margin: 0; color: var(--muted); max-width: 75ch; }
.legend-x { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--line-strong); background: var(--surface-2); display: inline-block; }
.legend i.dash { border-style: dashed; }
.legend i.full { background: var(--plate-soft); border-color: var(--plate); }

/* ---------- cronômetro ---------- */
.timer {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-top: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--navy); color: #fff;
  border-radius: 20px 20px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,.25);
  transform: translateY(0); transition: transform .25s ease;
}
.timer[hidden] { display: block !important; transform: translateY(120%); pointer-events: none; }
.timer-in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 10px 14px; align-items: center; }
.t-label { font-size: 13px; font-weight: 600; opacity: .75; }
.t-time { font-family: var(--display); font-weight: 800; font-size: 48px; line-height: 1; font-variant-numeric: tabular-nums; }
.t-done .t-time { color: var(--plate); }
.t-track { grid-column: 1 / -1; height: 6px; border-radius: 99px; background: rgba(255, 255, 255, .18); overflow: hidden; }
.t-fill { height: 100%; background: var(--plate); width: 100%; }
.t-actions { display: flex; gap: 8px; }
.t-actions button {
  min-width: 52px; min-height: 48px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, .3);
  background: transparent; color: #fff; font-weight: 700; cursor: pointer; font-size: 15px;
}
.t-actions .t-stop { background: #fff; color: var(--navy); padding: 0 14px; }

@media (max-width: 520px) {
  .top-meta { width: 100%; }
  .meta-box { flex: 1; min-width: 0; }
  .ex { grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; padding-right: 10px; padding-left: 12px; }
  .check { width: 40px; height: 40px; font-size: 14px; }
  .is-combo .ex:not(:last-child)::after, .is-circuit .ex:not(:last-child)::after { left: 31px; top: 48px; }
  .vid { width: 96px; }
  .ex-name { font-size: 15px; }
  .t-time { font-size: 42px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<header class="top-band"><div class="wrap top">
  <div>
    <div class="who">Matheus de Farias · Ficha de treino</div>
    <h1 id="ptitle">Periodização 6</h1>
  </div>
  <div class="top-meta" id="pmeta"></div>
</div></header>

<nav class="bar" aria-label="Escolher treino">
  <div class="wrap">
    <div class="scroller" id="periods" role="group" aria-label="Periodização"></div>
    <div class="plates" id="workouts" role="group" aria-label="Treino"></div>
  </div>
</nav>

<main class="wrap" id="view" data-plate="red"></main>

<div class="timer" id="timer" hidden role="status" aria-live="polite">
  <div class="timer-in">
    <div>
      <div class="t-label" id="tLabel">Descanso</div>
      <div class="t-time" id="tTime">0:00</div>
    </div>
    <div class="t-actions">
      <button type="button" id="tMinus" aria-label="Menos 15 segundos">−15</button>
      <button type="button" id="tPlus" aria-label="Mais 15 segundos">+15</button>
      <button type="button" class="t-stop" id="tStop">Fechar</button>
    </div>
    <div class="t-track"><div class="t-fill" id="tFill"></div></div>
  </div>
</div>

a alta","sets":"3x 8/8","video":"https://www.youtube.com/watch?v=oOIvbRG2sV4","videoFrom":null}]},{"n":"4","kind":"single","rest":"60s","restSec":60,"exercises":[{"code":"4","name":"Deadlift 1 halter","sets":"3x 8-10","video":"https://www.youtube.com/watch?v=Xm0rKAvldco","videoFrom":null}]},{"n":"5","kind":"single","rest":"60s","restSec":60,"exercises":[{"code":"5","name":"Remada curvada unilateral","sets":"3x 8/8","video":"https://www.youtube.com/watch?v=SUvZiVClLKw","videoFrom":null}]},{"n":"6","kind":"single","rest":"60s","restSec":60,"exercises":[{"code":"6","name":"Elevação do quadril unilateral","sets":"3x 8/8","video":"https://www.youtube.com/watch?v=7iTMevrJoNQ","videoFrom":null}]},{"n":"7","kind":"combo","rest":null,"restSec":null,"exercises":[{"code":"7.1","name":"Cadeira flexora unilateral","sets":"3x 8/8","video":"https://www.youtube.com/watch?v=g0eu4acDBEQ","videoFrom":null},{"code":"7.2","name":"Remada alta halteres","sets":"3x 8-10","video":"https://www.youtube.com/watch?v=LVQq6ZnM97U","videoFrom":null}]},{"n":"8","kind":"single","rest":"60s","restSec":60,"exercises":[{"code":"8","name":"Mesa flexora","sets":"3x 8-10","video":"https://www.youtube.com/watch?v=2-ULaRrQa7c","videoFrom":null}]},{"n":"9","kind":"single","rest":"60s","restSec":60,"exercises":[{"code":"9","name":"Deadbug com halteres","sets":"3x 8/8","video":"https://www.youtube.com/watch?v=pH9MV8aTm9s","videoFrom":null}]}]}]}],"notes":"Leia o treino inteiro com calma antes de começar. A preparação do movimento serve para alinhar o pensamento e organizar o corpo para a parte principal, começando com respiração diafragmática de 60 segundos. Quando houver exercícios 1.1, 1.2 e similares, faça em sequência; se houver intervalo ao final, descanse; se não houver, repita o primeiro da sequência. Os treinos usam combinados de até 2 combinações e os nomes foram facilitados para pesquisa e aprendizado.","intro":"","split":"AB"}];

const PLATES = ["red", "blue", "yellow", "green"];
const ICON = {
  play: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg>'
};

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

DATA.forEach(p => p.workouts.forEach((w, i) => {
  w.id = w.label === "Corrida" ? "corrida" : "t" + (i + 1);
  w.plate = w.id === "corrida" ? "steel" : PLATES[i % 4];
  w.count = w.sections.reduce((n, s) => n + s.blocks.reduce((m, b) => m + b.exercises.length, 0), 0);
}));
const LATEST = DATA[0].id;

let sel = store.get("treino.sel", { p: LATEST, w: "t1" });

function fromHash() {
  const m = /^#(p\d)-(t\d|corrida)$/.exec(location.hash);
  if (m) sel = { p: m[1], w: m[2] };
}
fromHash();

const getP = () => DATA.find(p => p.id === sel.p) || DATA[0];
const getW = p => p.workouts.find(w => w.id === sel.w) || p.workouts[0];

function setSel(p, w, scroll) {
  sel = { p, w };
  store.set("treino.sel", sel);
  try { history.replaceState(null, "", "#" + p + "-" + w); } catch (e) {}
  render();
  if (scroll) {
    const bar = document.querySelector(".bar");
    const y = document.getElementById("view").getBoundingClientRect().top + scrollY - bar.offsetHeight - 6;
    if (scrollY > y) window.scrollTo({ top: y, behavior: "smooth" });
  }
}

function renderPeriods() {
  const el = document.getElementById("periods");
  el.innerHTML = DATA.map(p => `
    <button type="button" class="per-btn" data-p="${p.id}" aria-pressed="${p.id === sel.p}">
      P${p.num}${p.id === LATEST ? " <small>atual</small>" : ""}
    </button>`).join("");
  el.querySelectorAll("button").forEach(b => b.onclick = () => {
    const p = DATA.find(x => x.id === b.dataset.p);
    const keep = p.workouts.some(w => w.id === sel.w) ? sel.w : p.workouts[0].id;
    setSel(p.id, keep, true);
  });
  const active = el.querySelector('[aria-pressed="true"]');
  if (active) active.scrollIntoView({ block: "nearest", inline: "nearest" });
}

function renderWorkouts(p) {
  const el = document.getElementById("workouts");
  el.innerHTML = p.workouts.map((w, i) => `
    <button type="button" class="plate-btn" data-plate="${w.plate}" data-w="${w.id}" aria-pressed="${w.id === sel.w}">
      <span class="plate-disc" aria-hidden="true">${w.id === "corrida" ? "C" : i + 1}</span>
      <span class="plate-txt"><b>${esc(w.label)}</b><span>${esc(w.title)}</span></span>
    </button>`).join("");
  el.querySelectorAll("button").forEach(b => b.onclick = () => setSel(p.id, b.dataset.w, true));
  const active = el.querySelector('[aria-pressed="true"]');
  if (active) active.scrollIntoView({ block: "nearest", inline: "nearest" });
}

function renderHeader(p) {
  document.getElementById("ptitle").innerHTML = `Periodização ${p.num}${p.id === LATEST ? ' <span class="now-pill">Atual</span>' : ""}`;
  const strength = p.workouts.filter(w => w.id !== "corrida");
  const ex = strength.reduce((n, w) => n + w.count, 0);
  document.getElementById("pmeta").innerHTML = `
    <div class="meta-box"><b>${esc(p.split.split(" ")[0])}</b><span>divisão</span></div>
    <div class="meta-box"><b>${strength.length}${p.workouts.length > strength.length ? "+1" : ""}</b><span>${p.workouts.length > strength.length ? "treinos + corrida" : "treinos"}</span></div>
    <div class="meta-box"><b>${ex}</b><span>exercícios</span></div>`;
}

function kindText(b) {
  if (b.kind === "circuit") return ["Circuito", "Sem descanso entre exercícios"];
  if (b.kind === "combo") return ["Combinado", b.restSec ? "Faça em sequência e descanse ao final" : "Faça os exercícios em sequência"];
  return ["Individual", b.restSec ? "Descanse após cada série" : "Execute as séries"];
}

function restHTML(b, w) {
  if (b.restSec) return `<button type="button" class="rest-btn" data-sec="${b.restSec}" data-label="Descanso · Bloco ${esc(b.n)}" aria-label="Iniciar descanso de ${esc(b.rest)}">${ICON.clock}${esc(b.rest)}</button>`;
  return `<span class="rest-none">${b.rest ? esc(b.rest) : "Descanso não informado"}</span>`;
}

function setsHTML(s) {
  const m = /^(.*?)\s*(drop set)$/i.exec(s);
  return m ? `${esc(m[1])}<em>drop set</em>` : esc(s);
}

function ytId(url) {
  const m = /(?:v=|shorts\/|youtu\.be\/|embed\/)([\w-]{11})/.exec(url || "");
  return m ? m[1] : null;
}

function videoHTML(e) {
  const id = ytId(e.video);
  const thumb = id ? `<img src="https://i.ytimg.com/vi/${id}/mqdefault.jpg" alt="" loading="lazy" decoding="async">` : "";
  return `<a class="vid${id ? "" : " no-thumb"}" href="${esc(e.video)}" target="_blank" rel="noopener noreferrer" aria-label="Assistir vídeo de ${esc(e.name)} no YouTube">${thumb}<span class="play">${ICON.play}</span></a>`;
}

function render() {
  const p = getP(), w = getW(p);
  sel = { p: p.id, w: w.id };
  renderHeader(p); renderPeriods(); renderWorkouts(p);
  const key = `treino.done.${p.id}.${w.id}`;
  const done = new Set(store.get(key, []));
  const view = document.getElementById("view");
  view.dataset.plate = w.plate;
  document.title = `${w.label} · P${p.num} — Ficha de Treino Matheus`;

  const intro = p.intro ? `<p class="callout">${esc(p.intro)}</p>` : "";
  const wnote = w.note ? `<p class="callout">${esc(w.note)}</p>` : "";

  const secs = w.sections.map(s => {
    const n = s.blocks.reduce((m, b) => m + b.exercises.length, 0);
    return `<section class="sec">
      <div class="sec-head"><h3>${esc(s.label)}</h3><span>${n} ${n === 1 ? "exercício" : "exercícios"}</span></div>
      <div class="blocks">${s.blocks.map(b => {
        const [k, hint] = kindText(b);
        return `<article class="block is-${b.kind}">
          <div class="b-head">
            <div class="b-num" aria-hidden="true">${esc(b.n)}</div>
            <div class="b-info"><b>Bloco ${esc(b.n)} · ${k}</b><span>${hint}</span></div>
            ${restHTML(b, w)}
          </div>
          <ul class="ex-list">${b.exercises.map(e => `
            <li class="ex" data-done="${done.has(e.code)}">
              <button type="button" class="check" data-code="${esc(e.code)}" aria-pressed="${done.has(e.code)}" aria-label="Marcar ${esc(e.name)} como feito"><span class="code">${esc(e.code)}</span>${ICON.check}</button>
              <div class="ex-main"><div class="ex-name">${esc(e.name)}</div><div class="ex-sets">${setsHTML(e.sets)}</div>${e.videoNote ? `<div class="ex-note">${esc(e.videoNote)}</div>` : ""}</div>
              ${videoHTML(e)}
            </li>`).join("")}
          </ul>
        </article>`;
      }).join("")}</div>
    </section>`;
  }).join("");

  view.innerHTML = `
    <div class="w-head">
      <div class="w-kicker">${esc(w.label)} · Periodização ${p.num}</div>
      <h2>${esc(w.title)}</h2>
      <div class="chips">${w.muscles.map(m => `<span class="chip">${esc(m)}</span>`).join("")}</div>
      <div class="progress">
        <div class="progress-num" id="pnum"></div>
        <div class="progress-track"><div class="progress-fill" id="pfill"></div></div>
        <button type="button" class="reset" id="preset">Limpar</button>
      </div>
      ${intro}${wnote}
    </div>
    ${secs}
    <section class="notes">
      <h3>Observações</h3>
      <p>${esc(p.notes)}</p>
    </section>`;

  view.querySelectorAll(".vid img").forEach(img => {
    const fail = () => img.closest(".vid").classList.add("no-thumb");
    if (img.complete && !img.naturalWidth) fail(); else img.addEventListener("error", fail);
  });

  const total = w.count;
  const upd = () => {
    document.getElementById("pnum").innerHTML = `${done.size}/${total} <small>feitos</small>`;
    document.getElementById("pfill").style.width = (total ? done.size / total * 100 : 0) + "%";
  };
  upd();
  view.querySelectorAll(".check").forEach(btn => btn.onclick = () => {
    const c = btn.dataset.code, on = !done.has(c);
    on ? done.add(c) : done.delete(c);
    btn.setAttribute("aria-pressed", on);
    btn.closest(".ex").dataset.done = on;
    store.set(key, [...done]); upd();
  });
  document.getElementById("preset").onclick = () => {
    done.clear(); store.set(key, []);
    view.querySelectorAll(".check").forEach(b => { b.setAttribute("aria-pressed", "false"); b.closest(".ex").dataset.done = "false"; });
    upd();
  };
  view.querySelectorAll(".rest-btn").forEach(b => b.onclick = () => Timer.start(+b.dataset.sec, b.dataset.label, w.plate));
}

/* ---------- cronômetro de descanso ---------- */
const Timer = (() => {
  const el = document.getElementById("timer"), tTime = document.getElementById("tTime"),
        tFill = document.getElementById("tFill"), tLabel = document.getElementById("tLabel");
  let end = 0, total = 0, raf = 0, lock = null, audio = null, beeped = false;
  const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  function beep() {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      [0, .25, .5].forEach(t => {
        const o = audio.createOscillator(), g = audio.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
        g.gain.setValueAtTime(.0001, audio.currentTime + t);
        g.gain.exponentialRampToValueAtTime(.3, audio.currentTime + t + .02);
        g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + t + .18);
        o.start(audio.currentTime + t); o.stop(audio.currentTime + t + .2);
      });
    } catch (e) {}
    try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
  }
  function tick() {
    const left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
    tTime.textContent = left ? fmt(left) : "Pronto!";
    tFill.style.width = (total ? left / total * 100 : 0) + "%";
    el.classList.toggle("t-done", !left);
    if (!left && !beeped) { beeped = true; beep(); tLabel.textContent = "Próxima série"; }
    if (left) raf = requestAnimationFrame(tick);
  }
  function start(sec, label, plate) {
    try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume && audio.resume(); } catch (e) {}
    cancelAnimationFrame(raf);
    total = sec; end = Date.now() + sec * 1000; beeped = false;
    tLabel.textContent = label; el.dataset.plate = plate; el.hidden = false;
    try { navigator.wakeLock && navigator.wakeLock.request("screen").then(l => lock = l).catch(() => {}); } catch (e) {}
    tick();
  }
  function add(d) {
    if (el.hidden) return;
    end = Math.max(Date.now(), end) + d * 1000; total = Math.max(total, Math.ceil((end - Date.now()) / 1000));
    if (d > 0) { beeped = false; el.classList.remove("t-done"); }
    cancelAnimationFrame(raf); tick();
  }
  function stop() { cancelAnimationFrame(raf); el.hidden = true; try { lock && lock.release(); } catch (e) {} lock = null; }
  document.getElementById("tPlus").onclick = () => add(15);
  document.getElementById("tMinus").onclick = () => add(-15);
  document.getElementById("tStop").onclick = stop;
  document.addEventListener("visibilitychange", () => { if (!document.hidden && !el.hidden) { cancelAnimationFrame(raf); tick(); } });
  return { start };
})();

window.addEventListener("hashchange", () => { fromHash(); render(); });
render();
</script>
